name: successive_halving
kwargs:
  # Per-arm warm-start threshold before GP/EI is allowed for that arm.
  # Round 1 screens clusters with deterministic anchor points.
  init_points: 3
  # Remaining optimization budget after the warm-start threshold.
  # Effective total budget defaults to init_points + n_iter.
  n_iter: 97
  beta: 0.75
  # Hierarchical physical-compressor sampling in round 2+.
  # Score = mean_reward + physical_ucb_beta * exploration + novelty bonus.
  physical_ucb_beta: 0.5
  physical_novelty_bonus: 0.25
  physical_softmax_temperature: 0.25
  num_restarts: 5
  raw_samples: 32
  verbose: 1
  alpha: 0.75
  device: cpu
