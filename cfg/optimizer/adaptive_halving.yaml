name: adaptive_halving
kwargs:
  # Total evaluation budget. The whole round schedule is derived from this
  # number (see AdaptiveHalvingOptimizer.compute_round_budgets), so any value
  # works and is spent exactly; --budget on run_experiments.py overrides it.
  total_budget: 100
  # Per-arm observation count below which candidates are random-sampled
  # (scale-aware, within the arm's own bounds) instead of proposed by GP/EI.
  init_points: 3
  # UCB exploration strength for arm selection within clusters and in the
  # final exploitation round.
  beta: 0.75
  # Halving rate: surviving cluster count becomes ceil(n / eta) per round.
  eta: 2
  # Halving stops at this many surviving logical clusters; the remaining
  # budget is then spent as one global UCB + GP/EI exploitation round.
  target_n_clusters: 2
  # UCB bonus for arms that have never been evaluated.
  novelty_bonus: 0.25
  num_restarts: 5
  raw_samples: 32
  verbose: 1
  alpha: 0.75
  device: cpu
