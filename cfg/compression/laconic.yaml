name: laconic
methods:
  - PoorMansCompressionMean
  - SwingFilter
  - SlideFilter
  - VW
  - MixPiece
  - DFT
  - BitPackedQuantization
  - BitPackedBUFF
  - MacaqueS
  - MacaqueV
  - DeltaEncoding
  - DeltatoDeltaPFOREncoding
  - DeltaEliasGammaEncoding
bounds:
  logical_method_index: [0, 5]
  coefficient_method_index: [6, 9]
  indices_method_index: [10, 12]
  logical_method_error: [0.001, 0.15]
  coefficient_method_error: [1.0e-7, 1.0e-2]
space:
  logical_method_index: {type: int, scale: linear}
  coefficient_method_index: {type: int, scale: linear}
  indices_method_index: {type: int, scale: linear}
  logical_method_error: {type: float, scale: linear, significant_digits: 2}
  coefficient_method_error: {type: float, scale: log, significant_digits: 2}
